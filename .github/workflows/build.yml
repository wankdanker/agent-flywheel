# Build and push the agent image to GHCR.
#   default branch → :latest + :sha-<short>   (what issues run on, unless AGENT_IMAGE pins one)
#   tag            → :<tag>
#   other branch   → :<branch>                (try an image change via the agent workflow's `image` input)
# Run this workflow by hand once to make the first image.
name: build

on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The image we publish is what the next issue runs on, so a red typecheck/test must never
  # reach it. Runs on every branch push too, so agent PRs (branches in this repo) get it as a check.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  labels:
    # Keep issue labels in sync with labels.json. Only on the default branch, since
    # that's the version of the file we want live.
    needs: [image]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - env:
          AGENT_PLATFORM: github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/sync-labels.ts
