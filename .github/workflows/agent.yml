# Work an issue with the agent image.
# Starts when a maintainer adds the `agent` label (only triage+ can), when a collaborator
# replies on an `agent/blocked` issue (our resume), or when a collaborator's comment starts with
# `/agent continue` (a forced rerun from any state). Other comments start nothing. Manual runs
# can pick the issue and image. After a checkpoint, the publish job dispatches this workflow
# itself with `trigger: relay` (auto-relay), at most MAX_CHAINED_RUNS times in a row before a
# maintainer has to weigh in (src/dispatch.ts, README "Chained runs and spend caps").
# Secrets: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; optional AGENT_GH_TOKEN (a PAT or app
# token) so the agent can edit .github/workflows and its PRs trigger CI.
# Variables: AGENT_IMAGE pins the image (e.g. ghcr.io/owner/repo:sha-1a2b3c4); CLAUDE_MODEL, MAX_TURNS;
# MAX_BUDGET_USD (per-run spend cap), MAX_CHAINED_RUNS (auto-relays in a row, default 3, 0 = off);
# optional MODEL_PROXY_MAX_REQUESTS/MODEL_PROXY_MAX_LIFETIME_MS/MODEL_PROXY_REQUEST_TIMEOUT_MS
# (see src/model-proxy.ts and README "Model credential exposure").
#
# One run is three jobs, each a `docker run` of the same image on its own runner, so the forge
# token and the model credential are never in the same job (see src/stages.ts, README
# "Credential separation"):
#   prepare  GH_TOKEN only:  fetch the issue, set agent/working, clone/check out the branch
#   agent    model key only: run the agent on that work dir, record its outcome in a file
#   publish  GH_TOKEN only:  validate the outcome and the branch as data, push, open the PR, label
# The work dir travels between them through the per-issue actions/cache, under a key unique to
# this run, attempt and stage. Or, opt-in with vars.PERSISTENCE_BUCKET, as a per-issue ext4 image
# in S3/GCS that each job loop-mounts around its `docker run` (bin/persist.sh, README "Persistent
# workspace images"); the cache steps are skipped then. The bucket credential (secrets
# PERSISTENCE_AWS_ACCESS_KEY_ID/PERSISTENCE_AWS_SECRET_ACCESS_KEY or PERSISTENCE_GCS_KEY) is only
# in the host-side restore/save steps, never handed to a container.
name: agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      image:
        description: Image to run (default vars.AGENT_IMAGE, then :latest)
        required: false
      # `relay` is what the publish job dispatches after a checkpoint; the prepare stage runs a
      # relay only while its announcement is still the latest trusted comment on a blocked issue.
      trigger:
        description: manual, or relay (continue a checkpoint, as the auto-relay does)
        required: false
        type: choice
        options: [manual, relay]
        default: manual

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read

# One run per issue at a time, across all three jobs. Runs whose event isn't ours to act on
# (the same condition as the prepare job's `if`) get a group of their own, so our own label
# changes and comments can't displace a pending human-triggered run. GitHub keeps one pending
# run per group; that's fine, since each run reads the whole thread, so the latest pending run
# covers every comment made in the meantime.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        contains(github.event.issue.labels.*.name, 'agent') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.comment.body, '<!-- agent-flywheel -->') &&
        (contains(github.event.issue.labels.*.name, 'agent/blocked') ||
          contains(github.event.comment.body, '/agent continue'))))
      && format('agent-issue-{0}', github.event.issue.number || inputs.issue)
      || format('agent-skip-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  PERSISTENCE_BUCKET: ${{ vars.PERSISTENCE_BUCKET }}
  PERSISTENCE_SIZE: ${{ vars.PERSISTENCE_SIZE }}

jobs:
  prepare:
    # When an event starts a run (src/dispatch.ts has the policy; bin/dispatch-gitlab.ts applies
    # the same on GitLab): the `agent` label being added; a trusted, non-bot comment on an
    # `agent/blocked` issue; or one starting with `/agent continue`, from any state. Ordinary
    # comments on working/review/queued issues start nothing. The command test here is only a
    # prefilter (expressions can't find the first nonblank line, and `contains` ignores case):
    # the prepare stage re-checks the command strictly, and the trigger against the issue's live
    # labels (AGENT_TRIGGER/AGENT_COMMENT below), and skips a run whose reason no longer holds. test/ci-config.test.ts evaluates this `if` against event
    # fixtures and checks the concurrency group above repeats it exactly. The author_association
    # allowlist must stay in sync with GITHUB_TRUSTED_ASSOCIATIONS in src/trust.ts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        contains(github.event.issue.labels.*.name, 'agent') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.comment.body, '<!-- agent-flywheel -->') &&
        (contains(github.event.issue.labels.*.name, 'agent/blocked') ||
          contains(github.event.comment.body, '/agent continue')))
    # GitHub gives issue/issue_comment-triggered runs a read-only cache by default (untrusted
    # triggers), which silently dropped every work-dir save. These jobs only run for trusted
    # people (the `if` above), no container ever sees the cache token, and the only thing
    # saved is this issue's own work dir, restored only by later jobs on this issue.
    cache-mode: write
    permissions:
      contents: read
      issues: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      proceed: ${{ steps.prepare.outputs.proceed }}
      image: ${{ steps.image.outputs.image }}
      work-key: ${{ steps.prepare.outputs.work-key }}
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Pinned by digest here and handed to the other two jobs, so all three run the same
      # image even if :latest moves mid-run.
      - name: Pull the agent image
        id: image
        env:
          IMAGE: ${{ inputs.image || vars.AGENT_IMAGE }}
        run: |
          image="${IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}:latest}"
          docker pull "$image" || { echo "::error::No agent image $image. Run the build workflow first."; exit 2; }
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image" 2>/dev/null || true)"
          echo "image=${digest:-$image}" >> "$GITHUB_OUTPUT"
      # Persistence only: persist.sh comes from the pinned image (no checkout in these jobs), and
      # runs on this host, outside any container. docker create/cp run nothing from the image.
      - name: Fetch the persistence script
        if: env.PERSISTENCE_BUCKET != ''
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker pull -q "$IMAGE" >/dev/null
          id="$(docker create "$IMAGE")"
          docker cp "$id:/opt/agent/bin/persist.sh" "$RUNNER_TEMP/persist.sh"
          docker rm "$id" >/dev/null
      # Mounts the issue's image (or a fresh one) on agent-work, or fails the job; nothing below
      # falls back to the cache once PERSISTENCE_BUCKET is set.
      - name: Restore the workspace image
        if: env.PERSISTENCE_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERSISTENCE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERSISTENCE_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PERSISTENCE_AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.PERSISTENCE_S3_ENDPOINT }}
          PERSISTENCE_GCS_KEY: ${{ secrets.PERSISTENCE_GCS_KEY }}
        run: bash "$RUNNER_TEMP/persist.sh" restore agent-work
      # Work dir is cached per issue so a run that dies partway (turn limit, crash) doesn't
      # lose its clone; the next run on that issue resumes from the newest entry (normally the
      # agent job's save) instead of recloning. Each save gets a fresh key, since actions/cache
      # only saves on a key miss.
      - name: Restore work directory cache
        if: env.PERSISTENCE_BUCKET == ''
        uses: actions/cache/restore@v4
        with:
          path: agent-work
          key: agent-work-issue-${{ env.ISSUE }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          restore-keys: |
            agent-work-issue-${{ env.ISSUE }}-
      - name: Prepare the work directory
        id: prepare
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          # How this run was started, for the prepare stage's re-check (src/dispatch.ts). The
          # comment body goes through env, never into the script text.
          AGENT_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && (inputs.trigger == 'relay' && 'relay' || 'manual') || github.event_name == 'issues' && 'label' || 'comment' }}
          AGENT_COMMENT: ${{ github.event.comment.body }}
          MAX_CHAINED_RUNS: ${{ vars.MAX_CHAINED_RUNS }}
        run: |
          # docker run rather than `container:`: same as a local run. The one bind mount (the
          # work dir) needs its owner matched to the image's user at run time (never
          # hardcoded, in case the image changes it), so it isn't a uid fight. With persistence,
          # the mounted image is owned by the runner user instead, so the container runs as that.
          mkdir -p agent-work
          if [ -n "$PERSISTENCE_BUCKET" ]; then
            as=(--user "$(id -u):$(id -g)")
          else
            uid="$(docker run --rm --entrypoint id "$IMAGE" -u)"
            sudo chown -R "$uid:$uid" agent-work
            as=()
          fi
          set +e
          docker run --rm "${as[@]}" -e AGENT_PLATFORM=github -e ISSUE -e GH_TOKEN -e AGENT_TRIGGER -e AGENT_COMMENT -e MAX_CHAINED_RUNS \
            -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_API_URL \
            -v "$PWD/agent-work:/work" \
            "$IMAGE" --stage prepare
          code=$?
          echo "work-key=agent-work-issue-$ISSUE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-prepared" >> "$GITHUB_OUTPUT"
          if [ "$code" = 0 ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 10 = blocked before the agent started (an untrusted issue awaiting a maintainer's go-ahead).
          if [ "$code" = 10 ]; then echo "::notice::#$ISSUE is waiting on a trusted maintainer"; exit 0; fi
          # 30 = the trigger no longer applies to the issue's live state (the log says why); nothing touched.
          if [ "$code" = 30 ]; then echo "::notice::#$ISSUE: nothing to run ($AGENT_TRIGGER no longer applies)"; exit 0; fi
          exit "$code"
      - name: Hand the work directory to the agent job
        if: steps.prepare.outputs.proceed == 'true' && env.PERSISTENCE_BUCKET == ''
        uses: actions/cache/save@v4
        with:
          path: agent-work
          key: ${{ steps.prepare.outputs.work-key }}
      - name: Save the workspace image
        if: always() && env.PERSISTENCE_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERSISTENCE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERSISTENCE_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PERSISTENCE_AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.PERSISTENCE_S3_ENDPOINT }}
          PERSISTENCE_GCS_KEY: ${{ secrets.PERSISTENCE_GCS_KEY }}
        run: '[ ! -f "$RUNNER_TEMP/persist.sh" ] || bash "$RUNNER_TEMP/persist.sh" save agent-work'

  agent:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    cache-mode: write
    # No issues/contents/pull-requests scopes: nothing in this job can write to the forge.
    permissions:
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      work-key: ${{ steps.key.outputs.work-key }}
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Restore the prepared work directory
        if: env.PERSISTENCE_BUCKET == ''
        uses: actions/cache/restore@v4
        with:
          path: agent-work
          key: ${{ needs.prepare.outputs.work-key }}
          fail-on-cache-miss: true
      - name: Fetch the persistence script
        if: env.PERSISTENCE_BUCKET != ''
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          docker pull -q "$IMAGE" >/dev/null
          id="$(docker create "$IMAGE")"
          docker cp "$id:/opt/agent/bin/persist.sh" "$RUNNER_TEMP/persist.sh"
          docker rm "$id" >/dev/null
      - name: Restore the workspace image
        if: env.PERSISTENCE_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERSISTENCE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERSISTENCE_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PERSISTENCE_AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.PERSISTENCE_S3_ENDPOINT }}
          PERSISTENCE_GCS_KEY: ${{ secrets.PERSISTENCE_GCS_KEY }}
        run: bash "$RUNNER_TEMP/persist.sh" restore agent-work
      - name: Name this job's work directory save
        id: key
        run: echo "work-key=agent-work-issue-$ISSUE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-agent" >> "$GITHUB_OUTPUT"
      # The model credential and nothing else secret: no GH_TOKEN, so the agent (running Bash
      # with permissions bypassed) has no forge credential to find. `--stage agent` also
      # refuses to start if one reaches it (env, credential files or git config).
      - name: Run the agent
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MAX_TURNS: ${{ vars.MAX_TURNS }}
          MAX_BUDGET_USD: ${{ vars.MAX_BUDGET_USD }}
          MODEL_PROXY_MAX_REQUESTS: ${{ vars.MODEL_PROXY_MAX_REQUESTS }}
          MODEL_PROXY_MAX_LIFETIME_MS: ${{ vars.MODEL_PROXY_MAX_LIFETIME_MS }}
          MODEL_PROXY_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_PROXY_REQUEST_TIMEOUT_MS }}
        run: |
          docker pull "$IMAGE"
          if [ -n "$PERSISTENCE_BUCKET" ]; then
            as=(--user "$(id -u):$(id -g)")
          else
            uid="$(docker run --rm --entrypoint id "$IMAGE" -u)"
            sudo chown -R "$uid:$uid" agent-work
            as=()
          fi
          docker run --rm "${as[@]}" -e ISSUE \
            -e ANTHROPIC_API_KEY -e CLAUDE_CODE_OAUTH_TOKEN -e CLAUDE_MODEL -e MAX_TURNS -e MAX_BUDGET_USD \
            -e MODEL_PROXY_MAX_REQUESTS -e MODEL_PROXY_MAX_LIFETIME_MS -e MODEL_PROXY_REQUEST_TIMEOUT_MS \
            -v "$PWD/agent-work:/work" \
            "$IMAGE" --stage agent
      # Always, so a failed or timed-out agent still keeps its work for the next run to resume,
      # and the publish job still gets a work dir to settle the issue from.
      - name: Save work directory cache
        if: always() && env.PERSISTENCE_BUCKET == ''
        uses: actions/cache/save@v4
        with:
          path: agent-work
          key: ${{ steps.key.outputs.work-key }}
      # Same always(), for the same reason: a failed run's tree, uncommitted edits included, is
      # what the next run resumes from.
      - name: Save the workspace image
        if: always() && env.PERSISTENCE_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERSISTENCE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERSISTENCE_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PERSISTENCE_AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.PERSISTENCE_S3_ENDPOINT }}
          PERSISTENCE_GCS_KEY: ${{ secrets.PERSISTENCE_GCS_KEY }}
        run: '[ ! -f "$RUNNER_TEMP/persist.sh" ] || bash "$RUNNER_TEMP/persist.sh" save agent-work'

  publish:
    needs: [prepare, agent]
    # Also after a failed agent job: with no recorded outcome to apply, the publish stage still
    # takes the issue off agent/working (blocked, with a comment pointing at the logs).
    if: always() && needs.prepare.outputs.proceed == 'true'
    permissions:
      # actions: write is for the auto-relay's workflow_dispatch of this workflow.
      actions: write
      contents: write
      issues: write
      pull-requests: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # A miss (the agent job never saved) is left to the publish stage to report.
      - name: Restore the agent's work directory
        if: env.PERSISTENCE_BUCKET == ''
        uses: actions/cache/restore@v4
        with:
          path: agent-work
          key: ${{ needs.agent.outputs.work-key || 'none' }}
      - name: Fetch the persistence script
        if: env.PERSISTENCE_BUCKET != '' && needs.agent.result != 'skipped'
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          docker pull -q "$IMAGE" >/dev/null
          id="$(docker create "$IMAGE")"
          docker cp "$id:/opt/agent/bin/persist.sh" "$RUNNER_TEMP/persist.sh"
          docker rm "$id" >/dev/null
      # Read-only: this job only reads the work dir as data, so its save just unmounts. Not
      # when the agent job never ran (prepare failed, maybe before its save landed): the bucket
      # could still hold the last run's image, outcome.json and all. An empty agent-work is what
      # the cache's miss gives the publish stage, too.
      - name: Restore the workspace image
        if: env.PERSISTENCE_BUCKET != '' && needs.agent.result != 'skipped'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERSISTENCE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERSISTENCE_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PERSISTENCE_AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.PERSISTENCE_S3_ENDPOINT }}
          PERSISTENCE_GCS_KEY: ${{ secrets.PERSISTENCE_GCS_KEY }}
        run: bash "$RUNNER_TEMP/persist.sh" restore agent-work --read-only
      # The forge token and no model credential. The work dir (the agent's commits and its
      # outcome.json) is only read as data: see src/handoff.ts and src/publish.ts.
      - name: Publish the outcome
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          MAX_TURNS: ${{ vars.MAX_TURNS }}
          MAX_CHAINED_RUNS: ${{ vars.MAX_CHAINED_RUNS }}
        run: |
          docker pull "$IMAGE"
          mkdir -p agent-work
          if [ -n "$PERSISTENCE_BUCKET" ]; then
            as=(--user "$(id -u):$(id -g)")
          else
            uid="$(docker run --rm --entrypoint id "$IMAGE" -u)"
            sudo chown -R "$uid:$uid" agent-work
            as=()
          fi
          set +e
          docker run --rm "${as[@]}" -e AGENT_PLATFORM=github -e ISSUE -e GH_TOKEN -e MAX_TURNS -e MAX_CHAINED_RUNS \
            -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_API_URL \
            -v "$PWD/agent-work:/work" \
            "$IMAGE" --stage publish
          code=$?
          # 10 = asked a question on the issue; not a failure for us.
          if [ "$code" = 10 ]; then echo "::notice::Asked a question on #$ISSUE"; exit 0; fi
          # 20 = paused at a checkpoint (turn limit or MAX_BUDGET_USD), work pushed; also not a failure.
          # The stage has already relayed it to a new run of this workflow, unless MAX_CHAINED_RUNS was reached.
          if [ "$code" = 20 ]; then echo "::notice::Checkpointed #$ISSUE (see the issue for whether it relayed)"; exit 0; fi
          exit "$code"
      - name: Save the workspace image
        if: always() && env.PERSISTENCE_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PERSISTENCE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PERSISTENCE_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.PERSISTENCE_AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.PERSISTENCE_S3_ENDPOINT }}
          PERSISTENCE_GCS_KEY: ${{ secrets.PERSISTENCE_GCS_KEY }}
        run: '[ ! -f "$RUNNER_TEMP/persist.sh" ] || bash "$RUNNER_TEMP/persist.sh" save agent-work'

  # The stages already leave a terminal label on every failure they can catch. This covers
  # what they can't: a container killed by a job timeout or a cancel before it could clean up.
  # (Losing a runner itself runs nothing; see README "Stuck on agent/working".)
  unstick:
    needs: [prepare, agent, publish]
    if: (failure() || cancelled()) && needs.prepare.result != 'skipped'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unstick agent/working
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'agent/working'; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label agent/working --add-label agent/blocked
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$(printf '%s\n\n%s\n\n%s' \
              '🤖 **Agent Flywheel**' \
              "The run was stopped (timed out or cancelled) before it could finish, so I've marked this issue blocked. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Reply here to have me retry." \
              '<!-- agent-flywheel -->')"
          fi
