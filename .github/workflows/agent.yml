# Work an issue with the agent image.
# Starts when a maintainer adds the `agent` label (only triage+ can), or when a
# collaborator comments on an `agent` issue (our resume). Manual runs can pick the issue and image.
# Secrets: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; optional AGENT_GH_TOKEN (a PAT or app
# token) so the agent can edit .github/workflows and its PRs trigger CI.
# Variables: AGENT_IMAGE pins the image (e.g. ghcr.io/owner/repo:sha-1a2b3c4); CLAUDE_MODEL, MAX_TURNS;
# optional MODEL_PROXY_MAX_REQUESTS/MODEL_PROXY_MAX_LIFETIME_MS/MODEL_PROXY_REQUEST_TIMEOUT_MS
# (see src/model-proxy.ts and README "Model credential exposure").
name: agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      image:
        description: Image to run (default vars.AGENT_IMAGE, then :latest)
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read

concurrency:
  # Never two runs on one issue; a newer event queues behind the running one.
  group: agent-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  work:
    # The author_association allowlist below must stay in sync with
    # GITHUB_TRUSTED_ASSOCIATIONS in src/trust.ts, which gates what the agent reads as
    # instructions using the same rule.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        contains(github.event.issue.labels.*.name, 'agent') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.comment.body, '<!-- agent-flywheel -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Work dir is cached per issue so a run that dies partway (turn limit, crash) doesn't
      # lose its clone; the next run on that issue resumes from it instead of recloning.
      # A fresh cache key per run, with the issue's latest entry as a restore-key fallback,
      # keeps it updated even though actions/cache only saves on a key miss.
      - name: Restore work directory cache
        uses: actions/cache@v4
        with:
          path: agent-work
          key: agent-work-issue-${{ github.event.issue.number || inputs.issue }}-${{ github.run_id }}
          restore-keys: |
            agent-work-issue-${{ github.event.issue.number || inputs.issue }}-
      - name: Work the issue
        env:
          IMAGE: ${{ inputs.image || vars.AGENT_IMAGE }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MAX_TURNS: ${{ vars.MAX_TURNS }}
          MODEL_PROXY_MAX_REQUESTS: ${{ vars.MODEL_PROXY_MAX_REQUESTS }}
          MODEL_PROXY_MAX_LIFETIME_MS: ${{ vars.MODEL_PROXY_MAX_LIFETIME_MS }}
          MODEL_PROXY_REQUEST_TIMEOUT_MS: ${{ vars.MODEL_PROXY_REQUEST_TIMEOUT_MS }}
        run: |
          image="${IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}:latest}"
          docker pull "$image" || { echo "::error::No agent image $image. Run the build workflow first."; exit 2; }
          # docker run rather than `container:`: same as a local run. The one bind mount we do
          # have (the work dir cache) needs its owner matched to the image's user at run time
          # (never hardcoded, in case the image changes it), so it isn't a uid fight.
          mkdir -p agent-work
          uid="$(docker run --rm --entrypoint id "$image" -u)"
          sudo chown -R "$uid:$uid" agent-work
          set +e
          docker run --rm -e AGENT_PLATFORM=github -e ISSUE -e GH_TOKEN \
            -e ANTHROPIC_API_KEY -e CLAUDE_CODE_OAUTH_TOKEN -e CLAUDE_MODEL -e MAX_TURNS \
            -e MODEL_PROXY_MAX_REQUESTS -e MODEL_PROXY_MAX_LIFETIME_MS -e MODEL_PROXY_REQUEST_TIMEOUT_MS \
            -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_API_URL \
            -v "$PWD/agent-work:/work" \
            "$image"
          code=$?
          # 10 = asked a question on the issue; not a failure for us.
          if [ "$code" = 10 ]; then echo "::notice::Asked a question on #$ISSUE"; exit 0; fi
          exit "$code"
