# Build and push the agent image to this project's container registry.
#   default branch → :sha-<short>, then :latest only once that image passes smoke-image
#                    (what issues run on, unless AGENT_IMAGE pins one)
#   tag            → :<tag>
#   other branch   → :<branch-slug>           (try an image change via a manual run with AGENT_IMAGE)
# A manual "Run pipeline" without ISSUE builds too; that's how the first image gets made.

build-image:
  stage: build
  needs: [test]   # see test.yml: a red suite must never reach the image issues run on
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web" && $ISSUE == null
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then tags="$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then tags="sha-$CI_COMMIT_SHORT_SHA"
      else tags="$CI_COMMIT_REF_SLUG"; fi
      docker build $(for t in $tags; do echo "-t $CI_REGISTRY_IMAGE:$t"; done) .
      for t in $tags; do docker push "$CI_REGISTRY_IMAGE:$t"; done

# One real model turn through the new image's own proxy path (entrypoint.sh --smoke, see
# src/smoke.ts), and only then tag it :latest: unit tests mock the SDK and the upstream, and
# a broken :latest also breaks the run that would fix it (#28). Default branch only, so it
# costs one tiny request per merge. Fails → :latest stays on the last good image.
# `docker run` rather than `image:` so the container gets only the vars listed below: a job's
# own env holds every project CI/CD variable, AGENT_GITLAB_TOKEN included.
smoke-image:
  stage: build
  needs: [build-image]
  image: docker:27
  services: [docker:27-dind]
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" && $ISSUE == null && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - image="$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
    - docker pull "$image"
    # Same model secret and optional vars as an issue run, each passed as `-e VAR`; an unset
    # one goes in as "", the way agent.yml's `docker run` hands it over on GitHub.
    - |
      export ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}" CLAUDE_CODE_OAUTH_TOKEN="${CLAUDE_CODE_OAUTH_TOKEN:-}" \
        CLAUDE_MODEL="${CLAUDE_MODEL:-}" SMOKE_MODEL="${SMOKE_MODEL:-}" \
        MODEL_PROXY_MAX_REQUESTS="${MODEL_PROXY_MAX_REQUESTS:-}" MODEL_PROXY_MAX_LIFETIME_MS="${MODEL_PROXY_MAX_LIFETIME_MS:-}" \
        MODEL_PROXY_REQUEST_TIMEOUT_MS="${MODEL_PROXY_REQUEST_TIMEOUT_MS:-}"
      docker run --rm \
        -e ANTHROPIC_API_KEY -e CLAUDE_CODE_OAUTH_TOKEN -e CLAUDE_MODEL -e SMOKE_MODEL \
        -e MODEL_PROXY_MAX_REQUESTS -e MODEL_PROXY_MAX_LIFETIME_MS -e MODEL_PROXY_REQUEST_TIMEOUT_MS \
        "$image" --smoke
    - docker tag "$image" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
